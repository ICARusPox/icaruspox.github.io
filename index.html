<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICARusPox Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <div class="brand">
            <h1>ICARusPox</h1>
            <span>Genome-wide Vaccinia Virus High-Content Imaging Screen V1.0 <br>(Refined with Interactome-Corrected
                Analysis of RNAi)</span>
        </div>
        <div class="stats">
            <div class="stat-item"><span class="stat-label">Total Hits</span><span class="stat-value"
                    id="stat-total">0</span></div>
            <div class="stat-item"><span class="stat-label">Significant</span><span class="stat-value"
                    id="stat-sig">0</span></div>
            <div class="stat-item"><span class="stat-label">Pro-Viral</span><span class="stat-value pro"
                    id="stat-pro">0</span></div>
            <div class="stat-item"><span class="stat-label">Anti-Viral</span><span class="stat-value anti"
                    id="stat-anti">0</span></div>
        </div>
    </header>

    <div class="controls">
        <input type="text" id="search" placeholder="Search gene..." autocomplete="off">
        <select id="directionFilter">
            <option value="all">All Directions</option>
            <option value="pro-viral">Pro-viral</option>
            <option value="anti-viral">Anti-viral</option>
            <option value="none">None</option>
        </select>
        <select id="categoryFilter">
            <option value="all">All Categories</option>
        </select>
        <label class="checkbox-group">
            <input type="checkbox" id="sigFilter"> Significant only (FDR < 0.05) </label>
    </div>

    <div class="main-content">
        <div class="table-section">
            <table>
                <thead>
                    <tr>
                        <th>Gene</th>
                        <th>Log2 FC</th>
                        <th>p-value</th>
                        <th>FDR</th>
                        <th>Direction</th>
                        <th>Category</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>

        <div class="chart-section">
            <div class="chart-card">
                <h3>Volcano Plot</h3>
                <div class="canvas-wrapper">
                    <canvas id="volcanoPlot"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
